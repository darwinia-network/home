name: Deploy production

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: darwinia-network/devops/actions/smart-vercel@main
        name: Deploy to Vercel
        id: vercel
        with:
          node_version: 20
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_group: itering
          script_install: npm i
          # The uploaded static bundle supplies its own supported Vercel Node version.
          script_build: |
            npm run build
            printf '%s\n' '{"private":true,"engines":{"node":"24.x"}}' > build/package.json
          preview_output: true
          project_name: home
          prod_mode: true
          enable_cache: true
          enable_notify_slack: false

      - name: Slack Notification
        if: ${{ success() && steps.vercel.outputs.PREVIEW_LINK != '' }}
        uses: rtCamp/action-slack-notify@v2
        continue-on-error: true
        env:
          SLACK_CHANNEL: public-ringdao-apps
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON: https://avatars.githubusercontent.com/u/14985020?s=48&v=4
          SLACK_MESSAGE: ${{ steps.vercel.outputs.PREVIEW_LINK }}
          SLACK_TITLE: Preview
          SLACK_USERNAME: Vercel
          SLACK_WEBHOOK: ${{ secrets.SLACK_INCOMING_WEBHOOK_URL }}
